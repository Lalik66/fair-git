name: CI

# Runs lint, typecheck/build, and tests for both workspaces on every push and PR.
# Nothing else in the repo verifies these automatically, so this is the safety
# net for regressions. A non-blocking audit job surfaces new advisories without
# failing the build (the repo carries known deferred vuln debt — see TODO.md).

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend (lint · typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Prisma Client must be generated before tsc can typecheck against it.
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
        env:
          NODE_ENV: test

  frontend:
    name: Frontend (lint · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `build` runs `tsc && vite build`, so this covers typecheck too.
      - run: npm run build
      - run: npm test

  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    # Advisory visibility only — never fails the pipeline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend audit
        run: cd backend && npm audit --omit=dev || true
      - name: Frontend audit
        run: cd frontend && npm audit --omit=dev || true
